<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" role="img" aria-label="Setting backup">
  <title>Setting backup</title>
  <defs>
    <linearGradient id="tile" x1="4" y1="2" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3FD2AE"/>
      <stop offset="1" stop-color="#0E7C64"/>
    </linearGradient>
    <linearGradient id="lip" x1="18" y1="6" x2="18" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6FFF8"/>
    </linearGradient>
  </defs>

  <rect width="36" height="36" rx="9" fill="url(#tile)"/>

  <!-- zip body -->
  <rect x="8.6" y="7.6" width="18.8" height="20.8" rx="3.2" fill="#FFFFFF"/>
  <!-- zipper channel carved out of the body -->
  <rect x="16.5" y="7.6" width="3" height="20.8" fill="url(#tile)"/>
  <!-- zipper teeth -->
  <g fill="#FFFFFF">
    <rect x="15.3" y="10.6" width="1.5" height="1.8" rx="0.6"/>
    <rect x="19.2" y="13.2" width="1.5" height="1.8" rx="0.6"/>
    <rect x="15.3" y="15.8" width="1.5" height="1.8" rx="0.6"/>
    <rect x="19.2" y="18.4" width="1.5" height="1.8" rx="0.6"/>
    <rect x="15.3" y="21" width="1.5" height="1.8" rx="0.6"/>
    <rect x="19.2" y="23.6" width="1.5" height="1.8" rx="0.6"/>
  </g>
  <!-- slider + pull tab -->
  <rect x="14.6" y="8.8" width="6.8" height="3.6" rx="1.6" fill="url(#lip)"/>
  <rect x="17.2" y="9.6" width="1.6" height="2" rx="0.6" fill="#0E7C64"/>

  <!-- Restore badge stays distinct from the archive at small sizes. -->
  <circle cx="26" cy="26" r="7" fill="#0E7C64"/>
  <path d="M22.5 24.5a3.8 3.8 0 1 1 0 3.2M22.5 21.5v3h3" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
